[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "green-hiring"
version = "0.1.0"
description = "Green Hiring Pipeline: tiered, data-minimal and measurable CV pre-screening."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.22",
    "sqlalchemy==2.0.49",
    "pydantic-settings==2.10.1",
    "pypdf==6.11.0",
    "numpy==2.2.6",
    "sentence-transformers==6.2.0",
    "httpx==0.28.1",
    "codecarbon==3.3.2",
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
