{% extends "base.html" %}
{% block title %}İşveren girişi · Yeşil İşe Alım{% endblock %}
{% block content %}
<h1>İşveren girişi</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ paths.EMPLOYER_LOGIN_PATH }}" class="stack">
<label for="token">Erişim anahtarı</label>
<input id="token" name="token" type="password" autocomplete="off" required autofocus>
<button type="submit">Giriş yap</button>
</form>
{% endblock %}
